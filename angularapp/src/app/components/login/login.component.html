<div class="container py-5 fade-in">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="pts-card p-4 p-md-5">

        <!-- Brand icon -->
        <div class="text-center mb-3">
          <span class="pts-logo-circle">
            <span class="pts-logo-dot-lg"></span>
          </span>
        </div>

        <h2 class="text-center fw-semibold mb-1">Welcome Back</h2>
        <p class="text-center text-muted small mb-4">Sign in to your ProTech account</p>

        <form #loginForm="ngForm" (ngSubmit)="onSubmit()" novalidate>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label fw-medium">
              Email <span class="text-danger">*</span>
            </label>
            <input type="email" class="form-control" name="email" [(ngModel)]="login.Email" #email="ngModel"
              placeholder="you@example.com" required>
            <div class="text-danger small mt-1" *ngIf="email.invalid && email.touched">
              <span *ngIf="email.errors?.['required']">Email is required</span>
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label class="form-label fw-medium">
              Password <span class="text-danger">*</span>
            </label>
            <input type="password" class="form-control" name="password" [(ngModel)]="login.Password" #password="ngModel"
              placeholder="Enter your password" required minlength="6">
            <div class="text-danger small mt-1" *ngIf="password.invalid && password.touched">
              <span *ngIf="password.errors?.['required']">Password is required</span>
              <span *ngIf="password.errors?.['minlength']">Password must be at least 6 characters</span>
            </div>
          </div>

          <!-- Backend error -->
          <div *ngIf="validationErrors.length > 0" class="alert alert-danger mt-3">

            <ul class="mb-0">
              <li *ngFor="let error of validationErrors">
                {{ error }}
              </li>
            </ul>

          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-pts w-100 mt-3" [disabled]="loginForm.invalid">
            Login
          </button>

          <p class="text-center text-muted small mt-4 mb-0">
            Don't have an account?
            <a routerLink="/register" class="pts-link-inline">Register here</a>
          </p>
        </form>
      </div>

    </div>
  </div>
</div>
