<div class="feedback-wrapper fade-in">
  <div class="feedback-card">

    <div class="feedback-header">
      <h2>My Feedback</h2>
      <!-- <span class="feedback-count" *ngIf="dataloaded && feedbacks.length > 0">
          {{ feedbacks.length }} record(s)
        </span> -->
    </div>

    <div class="pts-card p-5 text-center" *ngIf="!dataloaded">
      <h5 class="text-muted mb-0">Loading...</h5>
    </div>

    <div class="table-responsive" *ngIf="feedbacks.length > 0">
      <table class="table pts-table align-middle mb-0">
        <thead>
          <tr>
            <th style="width: 130px;">Feedback ID</th>
            <th>Feedback</th>
            <th style="width: 220px;">Date</th>
            <th style="width: 120px;" class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let f of paginatedFeedbacks">
            <td><span class="id-chip">{{ f.feedbackId }}</span></td>
            <td class="feedback-text">{{ f.feedbackText }}</td>
            <td class="text-muted">{{ f.date | date: 'medium' }}</td>
            <td class="text-center">
              <button class="btn btn-sm pts-delete px-3" (click)="confirmDelete(f.feedbackId!)">
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- Empty state -->
    <div class="no-records" *ngIf="dataloaded && feedbacks.length === 0">
      <p class="mb-0">Oops! No records found</p>
    </div>

  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal-overlay" *ngIf="showDeleteModal">
  <div class="modal-box shadow-lg">
    <h5 class="pts-modal-title mb-4">Are you sure you want to delete this feedback?</h5>
    <div class="d-flex justify-content-center gap-3">
      <button class="btn pts-delete px-4" (click)="deleteFeedback()">Yes, Delete</button>
      <button class="btn btn-pts-outline px-4" (click)="cancelDelete()">Cancel</button>
    </div>
  </div>
</div>
<div class="pagination-container" *ngIf="feedbacks.length > itemsPerPage">
  <button class="page-btn" (click)="prevPage()" [disabled]="currentPage === 1">
    Previous
  </button>

  <button *ngFor="let page of pageNumbers" class="page-btn" [class.active]="currentPage === page"
    (click)="changePage(page)">
    {{ page }}
  </button>

  <button class="page-btn" (click)="nextPage()" [disabled]="currentPage === totalPages">
    Next
  </button>
</div>
