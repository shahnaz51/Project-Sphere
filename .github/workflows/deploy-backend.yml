name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main   # change to 'master' if that's your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore dotnetapp/dotnetapp.csproj

      - name: Build
        run: dotnet build dotnetapp/dotnetapp.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish dotnetapp/dotnetapp.csproj --configuration Release --no-build --output ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'YOUR-APP-SERVICE-NAME'          # e.g. projectsphere-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
